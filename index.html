<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#2e6e38">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>나의 서재</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script>if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script>
<style>
:root{--bg:#daebd4;--bg2:#c8dfbf;--bg3:#b8d3ae;--surface:#e8f3e3;--text:#1a2e16;--text2:#4a6644;--text3:#82a67a;--accent:#2e6e38;--border:#8fba84;--border2:#6fa063;--danger:#c0392b;--radius:16px;--rsm:10px;--font:-apple-system,'Pretendard','Apple SD Gothic Neo',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:var(--font);color:var(--text);font-size:15px}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:none;flex-direction:column;border-left:1.5px solid var(--border2);border-right:1.5px solid var(--border2);background:var(--bg)}
.screen{display:none;flex:1;flex-direction:column}.screen.active{display:flex}
button{font-family:var(--font);cursor:pointer;border:none;background:none}
input,textarea{font-family:var(--font);color:var(--text)}
.header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid var(--border2);background:var(--bg2);position:sticky;top:0;z-index:10}
.header-title{font-size:20px;font-weight:700;letter-spacing:-.3px;text-align:center}
.header-sub{font-size:12px;color:var(--text2);margin-top:2px;text-align:center}
.header-left{display:flex;align-items:center}
.header-right{display:flex;align-items:center}
.header-book-img{height:48px;width:auto;object-fit:contain}
.back-btn{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--accent);font-weight:600;padding:4px 0}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#aaa;display:inline-block;margin-left:6px;vertical-align:middle;transition:background .3s}
.sync-dot.ok{background:#3a3}.sync-dot.syncing{background:#fa0;animation:blink .7s infinite}.sync-dot.err{background:#e33}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.list-body{flex:1;overflow-y:auto;padding:14px 14px 100px;display:flex;flex-direction:column;gap:10px}
.search-wrap{padding:10px 14px 4px;background:var(--bg);position:relative}
.search-box{position:relative;display:flex;align-items:center}
.search-icon{position:absolute;left:12px;font-size:14px;color:var(--text3);pointer-events:none}
.search-input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:9px 34px 9px 34px;font-size:14px;outline:none;color:var(--text);transition:border-color .15s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--text3)}
.search-clear{position:absolute;right:8px;width:22px;height:22px;border-radius:50%;background:var(--bg3);color:var(--text2);font-size:13px;display:none;align-items:center;justify-content:center;line-height:1}
.search-clear.show{display:flex}
.book-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1.5px solid var(--border2);border-radius:var(--radius);background:var(--surface);cursor:pointer;transition:background .15s}
.book-row:active{background:var(--bg3)}
.book-thumb{width:46px;height:62px;border-radius:6px;background:var(--bg2);border:1.5px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.book-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.book-row-info{flex:1;min-width:0}
.book-row-title{font-size:15px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-row-author{font-size:12px;color:var(--text2);margin-top:3px}
.book-row-meta{font-size:11px;color:var(--text3);margin-top:4px}
.book-row-arrow{color:var(--text3);font-size:18px}
.fab{position:fixed;bottom:28px;right:50%;transform:translateX(50%);max-width:calc(480px - 40px);width:calc(100% - 40px);background:var(--accent);color:#fff;border-radius:14px;padding:15px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--border2);box-shadow:0 4px 16px rgba(46,110,56,.3);z-index:20}
.fab:active{opacity:.85}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:10px}
.empty-state .big-icon{font-size:48px;margin-bottom:8px}
.empty-state p{font-size:14px;text-align:center;line-height:1.6;color:var(--text2)}
.loading-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text2)}
.detail-body{flex:1;overflow-y:auto;padding-bottom:40px}
.cover-section{padding:16px 14px;display:flex;gap:14px;align-items:flex-start;background:var(--bg2);border-bottom:1.5px solid var(--border2)}
.cover-upload{width:88px;height:118px;border-radius:10px;background:var(--bg3);border:1.5px dashed var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;position:relative;cursor:pointer}
.cover-upload img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.cover-remove-btn{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(26,46,22,.72);color:#fff;font-size:13px;line-height:1;display:none;align-items:center;justify-content:center;z-index:3}
.cover-remove-btn:active{background:var(--danger)}
.cover-hint{font-size:10px;color:var(--text3);text-align:center;line-height:1.5;z-index:1;pointer-events:none}
.cover-hint-icon{font-size:20px;margin-bottom:4px}
.book-fields{flex:1;display:flex;flex-direction:column;gap:12px}
.field-block{display:flex;flex-direction:column;gap:4px}
.field-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.6px;text-transform:uppercase}
.field-input{font-size:15px;border:none;outline:none;background:none;border-bottom:1.5px solid var(--border);padding:4px 0 6px;width:100%;color:var(--text)}
.field-input::placeholder{color:var(--text3)}
.field-input.title{font-size:17px;font-weight:700}
.field-input:focus{border-bottom-color:var(--accent)}
.tab-bar{display:flex;border-bottom:1.5px solid var(--border2);background:var(--bg2);padding:0 14px}
.tab-btn{flex:1;padding:12px 0;font-size:14px;font-weight:600;color:var(--text3);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:color .15s,border-color .15s}
.tab-btn.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab-pane{display:none;padding:0 14px}.tab-pane.on{display:block}
.memo-input-wrap{padding:14px 0 0;position:relative}
.memo-textarea{width:100%;min-height:90px;background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--rsm);padding:12px 12px 40px;font-size:16px;line-height:1.7;resize:none;outline:none;color:var(--text);transition:border-color .15s}
.memo-textarea:focus{border-color:var(--accent)}
.memo-textarea::placeholder{color:var(--text3)}
.memo-save-btn{position:absolute;bottom:8px;right:8px;background:var(--accent);color:#fff;border-radius:8px;padding:5px 14px;font-size:13px;font-weight:700}
.memo-save-btn:active{opacity:.8}
.voice-guide{font-size:12px;color:var(--text3);padding:8px 0 4px;}
.memo-section-label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;padding:18px 0 8px}
.memo-item{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rsm);padding:12px 14px;margin-bottom:8px}
.memo-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.memo-item-date{font-size:11px;color:var(--text3)}
.memo-item-btns{display:flex;gap:6px}
.memo-copy-btn{font-size:11px;color:var(--text2);padding:2px 8px;border-radius:6px;background:var(--bg2);border:1px solid var(--border)}
.memo-edit-btn{font-size:11px;color:var(--accent);padding:2px 8px;border-radius:6px;background:#d4ebcc;border:1px solid var(--border)}
.memo-del-btn{font-size:11px;color:var(--text2);padding:2px 8px;border-radius:6px;background:var(--bg2);border:1px solid var(--border)}
.memo-item-text{font-size:16px;line-height:1.75;color:var(--text);word-break:break-word}
.memo-edit-wrap{margin-top:8px;display:none}
.memo-edit-area{width:100%;min-height:200px;background:var(--bg);border:1.5px solid var(--accent);border-radius:var(--rsm);padding:8px 10px;font-size:16px;line-height:1.7;resize:vertical;outline:none;color:var(--text)}
.memo-edit-footer{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.memo-save-edit-btn{font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:7px;padding:4px 12px}
.memo-cancel-btn{font-size:12px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:4px 10px}
.memo-empty{padding:32px 0;text-align:center;font-size:13px;color:var(--text3)}
.review-wrap{padding:14px 0}
.review-box{background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--rsm);padding:14px}
.review-area{width:100%;min-height:240px;background:none;border:none;outline:none;resize:vertical;font-size:17px;line-height:1.8;color:var(--text)}
.review-area::placeholder{color:var(--text3)}
.review-count{font-size:11px;color:var(--text3);text-align:right;margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
.del-book-btn{font-size:13px;color:var(--text2);padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg3)}
.del-book-btn:active{background:#fde8e8;color:var(--danger)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-bg.open{display:flex}
.modal{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;border:1.5px solid var(--border2);border-bottom:none;padding:8px 24px 44px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 20px}
.modal-title{font-size:17px;font-weight:700;margin-bottom:20px}
.modal-field{margin-bottom:16px}
.modal-label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin-bottom:6px}
.modal-input{width:100%;border:none;border-bottom:1.5px solid var(--border2);padding:8px 0;font-size:16px;outline:none;background:none;color:var(--text)}
.modal-input:focus{border-bottom-color:var(--accent)}
.modal-input::placeholder{color:var(--text3)}
.modal-btn{width:100%;background:var(--accent);color:#fff;border-radius:14px;padding:15px;font-size:16px;font-weight:700;margin-top:8px;border:1.5px solid var(--border2)}
.modal-btn:active{opacity:.85}
.modal-cancel{width:100%;padding:12px;font-size:14px;color:var(--text2);margin-top:4px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(30,50,25,.88);color:#fff;border-radius:20px;padding:9px 20px;font-size:13px;font-weight:500;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
.md-content{font-size:16px;line-height:1.75;color:var(--text);word-break:break-word}
.md-content p{margin-bottom:10px}
.md-content p:last-child{margin-bottom:0}
.md-content ul,.md-content ol{margin-left:20px;margin-bottom:10px}
.md-content li{margin-bottom:4px}
.md-content blockquote{border-left:3px solid var(--accent);padding-left:10px;color:var(--text2);margin-bottom:10px}
.md-content code{background:var(--bg3);padding:2px 4px;border-radius:4px;font-family:monospace;font-size:13px}
.md-content pre{background:var(--bg2);padding:10px;border-radius:6px;overflow-x:auto;margin-bottom:10px}
.md-content pre code{background:none;padding:0;font-size:13px}
.md-content a{color:var(--accent);text-decoration:underline}
.md-content h1,.md-content h2,.md-content h3{margin-bottom:10px;font-weight:700}
.review-display{width:100%;min-height:240px;font-size:17px;line-height:1.8;color:var(--text);display:none;padding:4px}
</style>
</head>
<body>
<div id="boot-screen" style="display:flex; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; gap:14px;">
  <div class="spinner"></div>
  <div class="loading-text">나의 서재 여는 중…</div>
</div>
<div id="auth-screen" style="display:none; align-items:center; justify-content:center; min-height:100vh; padding:24px;">
  <div style="background:var(--surface); border-radius:28px; padding:56px 48px; box-shadow:0 8px 48px rgba(46,110,56,0.15); text-align:center; max-width:420px; width:100%; border:1.5px solid var(--border2);">
    <div style="font-size:52px; margin-bottom:16px;">📚</div>
    <h1 style="font-size:28px; font-weight:800; margin-bottom:10px; color:var(--text);">나의 서재</h1>
    <p style="color:var(--text2); font-size:15px; margin-bottom:36px; line-height:1.7;">독서 기록을 안전하게 보관하세요</p>
    <button id="btn-google-login" style="width:100%; padding:15px; border-radius:14px; border:2px solid var(--border); background:var(--bg); color:var(--text); font-size:16px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:12px; transition:all 0.2s;">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google로 로그인
    </button>
  </div>
</div>
<div id="denied-screen" style="display:none; align-items:center; justify-content:center; min-height:100vh; padding:24px;">
  <div style="background:var(--surface); border-radius:28px; padding:48px; box-shadow:0 8px 48px rgba(46,110,56,0.15); text-align:center; max-width:400px; width:100%; border:1.5px solid var(--border2);">
    <div style="font-size:52px; margin-bottom:16px;">🚫</div>
    <h2 style="font-size:22px; font-weight:700; margin-bottom:12px; color:var(--danger);">접근 권한 없음</h2>
    <p style="color:var(--text2); font-size:14px; margin-bottom:24px; line-height:1.7;">허가된 계정만 사용할 수 있어요.<br><span id="denied-email" style="color:var(--text); font-weight:700;"></span></p>
    <button id="btn-denied-signout" style="width:100%; padding:13px; border-radius:12px; border:1.5px solid var(--border); background:transparent; color:var(--text2); font-size:15px; cursor:pointer;">다른 계정으로 로그인</button>
  </div>
</div>
<div class="app" id="app">

<div id="screen-list" class="screen active">
  <div class="header">
    <div class="header-left">
      <img src="./b_1.png" class="header-book-img" alt="" decoding="async">
    </div>
    <div style="text-align:center">
      <div class="header-title">나의 서재</div>
      <div class="header-sub" id="book-count-label">읽은 책 0권</div>
    </div>
    <div class="header-right" style="display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:4px">
      <img src="./b_2.png" class="header-book-img" alt="" decoding="async">
      <button id="btn-logout" style="font-size:10px; padding:2px 6px; border-radius:4px; background:var(--bg3); border:1px solid var(--border); color:var(--text2); cursor:pointer;">로그아웃</button>
    </div>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="search-input" type="search" placeholder="책 제목 또는 저자 검색…" autocomplete="off">
      <button class="search-clear" id="search-clear" type="button" aria-label="검색어 지우기">×</button>
    </div>
  </div>
  <div class="list-body" id="list-body">
    <div class="loading-wrap"><div class="spinner"></div><div class="loading-text">불러오는 중…</div></div>
  </div>
  <button class="fab" id="fab-add"><span style="font-size:18px;line-height:1">+</span> 새 책 추가</button>
</div>

<div id="screen-detail" class="screen">
  <div class="header">
    <button class="back-btn" id="btn-back">
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M7 1L1 7l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      서재
    </button>
    <span class="sync-dot" id="sync-dot"></span>
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="pin-book-btn" id="btn-pin-book" style="font-size:13px; color:var(--text2); padding:5px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg3); transition:all 0.15s;">📌 고정</button>
      <button class="del-book-btn" id="btn-del-book">삭제</button>
    </div>
  </div>  <div class="detail-body">
    <div class="cover-section">
      <div class="cover-upload">
        <img id="cover-img" style="display:none">
        <button class="cover-remove-btn" id="btn-remove-cover" type="button" title="표지 삭제" aria-label="표지 삭제">×</button>
        <div class="cover-hint" id="cover-hint"><div class="cover-hint-icon">🖼</div><div>표지 추가</div></div>
        <input type="file" id="cover-file" accept="image/*">
      </div>
      <div class="book-fields">
        <div class="field-block">
          <div class="field-label">제목</div>
          <input class="field-input title" id="book-title-input" type="text" placeholder="책 제목">
        </div>
        <div class="field-block">
          <div class="field-label">저자</div>
          <input class="field-input" id="book-author-input" type="text" placeholder="저자 이름">
        </div>
      </div>
    </div>
    <div class="tab-bar">
      <button class="tab-btn on" id="tab-memo-btn">메모</button>
      <button class="tab-btn" id="tab-review-btn">독후감</button>
    </div>
    <div class="tab-pane on" id="tab-memo">
      <div class="memo-input-wrap">
        <textarea class="memo-textarea" id="memo-input" placeholder="기억하고 싶은 문장을 붙여넣거나 직접 입력하세요…"></textarea>
        <button class="memo-save-btn" id="btn-add-memo">저장</button>
      </div>
      <div class="voice-guide">🎤 음성 입력: 입력창 탭 후 키보드 마이크 버튼 사용</div>
      <div class="memo-section-label" id="memo-count-label">메모 0개</div>
      <div id="memo-list"></div>
    </div>
    <div class="tab-pane" id="tab-review">
      <div class="review-wrap">
        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:8px">
          <div class="voice-guide" style="padding:0">🎤 음성 입력: 입력창 탭 후 키보드 마이크 버튼 사용</div>
          <button id="btn-review-toggle" style="font-size:12px; font-weight:700; color:var(--accent); background:var(--bg3); padding:4px 10px; border-radius:6px">미리보기</button>

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.onload = resolve;

    document.head.appendChild(s);

}

let mdLibsPromise = null;
function ensureMarkdownLibs() {

    ]).catch(e => { mdLibsPromise = null; console.error('Markdown lib load failed:', e); });
  }
  return mdLibsPromise;
}

let katexPromise = null;
function ensureKatex() {
  if (window.katex) return Promise.resolve();
  if (!katexPromise) {
    loadStyle('https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css');

  }
  return katexPromise;
}

// KaTeX 수식 및 마크다운 렌더링 헬퍼
const PURIFY_OPTS = {
  ADD_TAGS: ['math','mrow','mi','mn','mo','msup','msub','mfrac','msubsup',
             'mover','munder','moverunder','menclose','msqrt','mroot',
             'mtable','mtr','mtd','mtext','mspace','mphantom','semantics','annotation'],
  ADD_ATTR: ['xmlns','display','class','style','aria-hidden','focusable','role',
             'viewBox','width','height','preserveAspectRatio','fill','stroke',
             'stroke-width','d','x','y','x1','x2','y1','y2','cx','cy','r',
             'rx','ry','transform','points','encoding']
};
function renderMath(raw) {
  const text = String(raw || '');
  if (!window.marked || !window.DOMPurify) {
    ensureMarkdownLibs().then(() => {
      if (curId && currentMemos.length) renderMemos(currentMemos);
    });
    return esc(text).replace(/\n/g, '<br>');
  }
  const hasMath = /\$[\s\S]+?\$/.test(text);
  if (hasMath && !window.katex) ensureKatex();

  const blocks = [];
  let processed = text
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => {
      const i = blocks.length;
      blocks.push({ d: true, expr: expr.trim() });
      return `@@MATHBLOCK${i}@@`;
    })
    .replace(/\$([^$\n]+?)\$/g, (_, expr) => {
      const i = blocks.length;
      blocks.push({ d: false, expr: expr.trim() });
      return `@@MATHINLINE${i}@@`;
    });
  let html = marked.parse(processed, { breaks: false, gfm: true });
  if (blocks.length) {
    if (window.katex) {
      html = html
        .replace(/@@MATHBLOCK(\d+)@@/g, (_, i) => {
          try { return katex.renderToString(blocks[i].expr, { displayMode: true,  throwOnError: false }); }
          catch(e) { return `<code>$$${esc(blocks[i].expr)}$$</code>`; }
        })
        .replace(/@@MATHINLINE(\d+)@@/g, (_, i) => {
          try { return katex.renderToString(blocks[i].expr, { displayMode: false, throwOnError: false }); }
          catch(e) { return `<code>$${esc(blocks[i].expr)}$</code>`; }
        });
    } else {
      html = html
        .replace(/@@MATHBLOCK(\d+)@@/g, (_, i) => `<code>$$${esc(blocks[i].expr)}$$</code>`)
        .replace(/@@MATHINLINE(\d+)@@/g, (_, i) => `<code>$${esc(blocks[i].expr)}$</code>`);
    }
  }
  return DOMPurify.sanitize(html, PURIFY_OPTS);
}

function resizeImage(file, maxWidth, maxHeight) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        canvas.toBlob(blob => {
          resolve(blob);
        }, file.type || 'image/jpeg', 0.85);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function deleteBook(){
  if(!curId) return;
  if(!confirm('이 책의 모든 내용이 삭제됩니다. 계속할까요?')) return;
  const targetId = curId;
  const book = books.find(x=>x.id===targetId);
  clearTimeout(saveTimer); saveTimer=null;
  clearTimeout(reviewTimer); reviewTimer=null;
  setSyncing();
  try{
    const memoSnap = await getDocs(collection(db,'books',targetId,'memos'));
    if(!memoSnap.empty){
      // Firestore writeBatch 한도(500개)를 넘지 않도록 450개 단위로 분할 삭제
      const docs = memoSnap.docs;
      for(let i=0; i<docs.length; i+=450){
        const batch = writeBatch(db);
        docs.slice(i, i+450).forEach(d=>batch.delete(d.ref));
        await batch.commit();
      }
    }
    if(book && book.cover){
      try{
        const { storage, ref, deleteObject } = await getStorageTools();
        await deleteObject(ref(storage, book.cover));
      }catch(_){}
    }
    await deleteDoc(doc(db,'books',targetId));
    curId=null;
    if(history.state && history.state.page==='detail') history.back();
    else goList();
    toast('삭제됐어요'); setSynced();
  }catch(e){ setSyncErr(); toast('삭제 실패'); }
}

  try{
    const [resizedBlob, { storage, ref, uploadBytes, getDownloadURL, deleteObject }] = await Promise.all([
      resizeImage(file, 400, 600),
      getStorageTools()
    ]);
    const storageRef = ref(storage, `covers/${currentUser ? currentUser.uid : 'anon'}/${targetId}_${Date.now()}`);
    await uploadBytes(storageRef, resizedBlob);
    const downloadURL = await getDownloadURL(storageRef);

    const img=$('cover-img'), hint=$('cover-hint'), rmBtn=$('btn-remove-cover');

    await updateDoc(doc(db,'books',targetId),{cover:downloadURL});
    // 기존 표지가 있었다면 Storage에서 정리해 고아 파일 방지
    if(oldCover && oldCover !== downloadURL){
      deleteObject(ref(storage, oldCover)).catch(()=>{});
    }
    setSynced();
    toast('표지가 저장됐어요');
  }catch(e){
    console.error(e);

  const targetId = curId;
  const book = books.find(x=>x.id===targetId);
  setSyncing();
  try{
    if(book && book.cover){
      try{
        const { storage, ref, deleteObject } = await getStorageTools();
        await deleteObject(ref(storage, book.cover));
      }catch(_){}
    }
    await updateDoc(doc(db,'books',targetId),{cover:null});
    const img=$('cover-img'), hint=$('cover-hint'), rmBtn=$('btn-remove-cover');
    img.removeAttribute('src'); img.style.display='none'; hint.style.display='flex'; rmBtn.style.display='none';
    setSynced();
    toast('표지가 삭제됐어요');
  }catch(err){
    setSyncErr();
    toast('표지 삭제 실패');
  }
});

// ── 메모 구독 (오래된 순 = asc) ──
function subscribeMemos(bookId){
  if(unsubMemos){ unsubMemos(); unsubMemos=null; }
  unsubMemos=onSnapshot(query(collection(db,'books',bookId,'memos'),orderBy('createdAt','asc')), snap=>{
    currentMemos = snap.docs.map(d=>({id:d.id,...d.data()}));
    // 서버 확정 스냅샷일 때만 memoCount 불일치 보정 (로컬 쓰기 중 중복 업데이트 방지)
    if(!snap.metadata.hasPendingWrites && !snap.metadata.fromCache){
      const curBook = books.find(x=>x.id===bookId);
      if(curBook && (curBook.memoCount||0) !== currentMemos.length){
        updateDoc(doc(db,'books',bookId),{memoCount:currentMemos.length}).catch(()=>{});
      }
    }
    renderMemos(currentMemos);
  });
}

function renderMemos(memos){
  const list=$('memo-list'), lbl=$('memo-count-label');
  if(!list||!lbl) return;
  lbl.textContent='메모 '+memos.length+'개';
  if(!memos.length){ list.innerHTML='<div class="memo-empty">아직 메모가 없어요</div>'; return; }

  // 백그라운드 동기화로 재렌더링 시 현재 수정 중인 메모의 입력 내용 보존
  const editingDrafts = new Map();
  list.querySelectorAll('.memo-edit-wrap').forEach(wrap => {
    if(wrap.style.display === 'block'){
      const id = wrap.id.replace('mew-','');
      const ta = $('mta-'+id);
      if(ta) editingDrafts.set(id, ta.value);
    }
  });

  list.innerHTML=memos.map(m=>{
    const d=m.createdAt?m.createdAt.toDate():new Date();
    const ds=d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes());
    const isEditing = editingDrafts.has(m.id);
    const editVal = isEditing ? editingDrafts.get(m.id) : m.text;
    return '<div class="memo-item" id="mi-'+esc(m.id)+'">'+
      '<div class="memo-item-head">'+
        '<span class="memo-item-date">'+ds+'</span>'+
        '<div class="memo-item-btns">'+
          '<button class="memo-copy-btn" data-id="'+esc(m.id)+'">복사</button>'+
          '<button class="memo-edit-btn" data-id="'+esc(m.id)+'">수정</button>'+
          '<button class="memo-del-btn"  data-id="'+esc(m.id)+'">삭제</button>'+
        '</div>'+
      '</div>'+
      '<div class="memo-item-text md-content" id="mt-'+esc(m.id)+'" style="display:'+(isEditing?'none':'block')+'">'+renderMath(m.text)+'</div>'+
      '<div class="memo-edit-wrap" id="mew-'+esc(m.id)+'" style="display:'+(isEditing?'block':'none')+'">'+
        '<textarea class="memo-edit-area" id="mta-'+esc(m.id)+'">'+esc(editVal)+'</textarea>'+
        '<div class="memo-edit-footer">'+
          '<button class="memo-cancel-btn"    data-id="'+esc(m.id)+'">취소</button>'+
          '<button class="memo-save-edit-btn" data-id="'+esc(m.id)+'">저장</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

// 메모 목록 이벤트 위임 (렌더링마다 리스너 재등록 방지)
$('memo-list').addEventListener('click', async e => {
  const btn = e.target.closest('button');
  if(!btn || !btn.dataset.id) return;
  const id = btn.dataset.id;

  if(btn.classList.contains('memo-copy-btn')){
    const m = currentMemos.find(x=>x.id===id);
    if(!m) return;
    try{ await navigator.clipboard.writeText(m.text); toast('메모가 복사됐어요'); }
    catch(_){ toast('복사에 실패했어요'); }
  } else if(btn.classList.contains('memo-edit-btn')){
    $('mt-'+id).style.display='none';
    $('mew-'+id).style.display='block';
    const ta = $('mta-'+id);
    ta.focus();
    setTimeout(() => ta.scrollIntoView({ behavior: 'smooth', block: 'center' }), 150);
  } else if(btn.classList.contains('memo-cancel-btn')){
    const m = currentMemos.find(x=>x.id===id);
    if(m && $('mta-'+id)) $('mta-'+id).value = m.text;
    $('mt-'+id).style.display='block';
    $('mew-'+id).style.display='none';
  } else if(btn.classList.contains('memo-save-edit-btn')){
    const text=$('mta-'+id).value.trim(); if(!text||!curId) return;
    setSyncing();
    try{
      await updateDoc(doc(db,'books',curId,'memos',id),{text});
      $('mt-'+id).style.display='block';
      $('mew-'+id).style.display='none';
      setSynced(); toast('메모가 수정됐어요');
    }catch(_){ setSyncErr(); toast('수정 실패'); }
  } else if(btn.classList.contains('memo-del-btn')){
    if(!curId || !confirm('이 메모를 삭제할까요?')) return;
    setSyncing();
    try{
      await deleteDoc(doc(db,'books',curId,'memos',id));
      await updateDoc(doc(db,'books',curId),{memoCount:increment(-1)});
      setSynced(); toast('메모가 삭제됐어요');
    }catch(_){ setSyncErr(); toast('삭제 실패'); }
  }
});

$('memo-list').addEventListener('keydown', e => {
  if(!e.target.classList.contains('memo-edit-area')) return;
  const id = e.target.id.replace('mta-','');
  if(e.key==='Escape'){
    const m = currentMemos.find(x=>x.id===id);
    if(m) e.target.value = m.text;
    $('mt-'+id).style.display='block';
    $('mew-'+id).style.display='none';
  } else if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){
    const saveBtn = $('memo-list').querySelector('.memo-save-edit-btn[data-id="'+id+'"]');
    if(saveBtn) saveBtn.click();
  }
});

// ── 메모 추가 ──
async function addMemo(){
  const inp=$('memo-input'), text=inp.value.trim(); if(!text||!curId) return;
  const btn=$('btn-add-memo');
  if(btn.disabled) return;
  btn.disabled=true;
  setSyncing();
  try{
    await addDoc(collection(db,'books',curId,'memos'),{text,createdAt:serverTimestamp()});
    await updateDoc(doc(db,'books',curId),{memoCount:increment(1)});
    inp.value=''; setSynced(); toast('메모가 저장됐어요');
  }catch(e){ setSyncErr(); toast('저장 실패'); }
  finally{ btn.disabled=false; }
}
$('btn-add-memo').addEventListener('click', addMemo);
$('memo-input').addEventListener('keydown', e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) addMemo(); });

const handleScrollIntoView = (e) => {
  setTimeout(() => {
    e.target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 150);
};
$('memo-input').addEventListener('focus', handleScrollIntoView);
$('review-input').addEventListener('focus', handleScrollIntoView);

// ── 독후감 ──
function debounceReview(){
  const rv=$('review-input');
  $('review-count').textContent=rv.value.length+'자';
  clearTimeout(reviewTimer);
  reviewTimer=setTimeout(async()=>{
    if(!curId) return; setSyncing();
    try{ await updateDoc(doc(db,'books',curId),{review:rv.value}); setSynced(); toast('독후감이 저장됐어요'); }
    catch(e){ setSyncErr(); }
  },1000);
}
$('review-input').addEventListener('input', debounceReview);

// ── 독후감 미리보기 토글 ──
if($('btn-review-toggle')) {
  $('btn-review-toggle').addEventListener('click', async ()=>{
    const isEdit = $('review-input').style.display !== 'none';
    if(isEdit){
      const val = $('review-input').value;
      $('review-input').style.display = 'none';
      $('review-display').style.display = 'block';
      $('btn-review-toggle').textContent = '수정';
      if(val.trim()){
        await ensureMarkdownLibs();
        $('review-display').innerHTML = renderMath(val);
      } else {
        $('review-display').innerHTML = '<div class="memo-empty">작성된 독후감이 없어요</div>';
      }
    } else {
      $('review-input').style.display = 'block';
      $('review-display').style.display = 'none';
      $('btn-review-toggle').textContent = '미리보기';
    }
  });
}

function showRootScreen(id) {
  ['boot-screen', 'auth-screen', 'denied-screen', 'app'].forEach(sid => {
    const el = $(sid);
    if(el) el.style.display = 'none';
  });
  const el = $(id);
  if(el) el.style.display = 'flex';
}

// 리다이렉트 로그인 직후에만 getRedirectResult 호출 (평소 첫 로딩 지연 제거)
try {
  if (sessionStorage.getItem('auth_redirect_pending') === '1') {
    sessionStorage.removeItem('auth_redirect_pending');
    getRedirectResult(auth).catch(e => {
      if(e && e.code !== 'auth/null-user') toast('로그인 실패: ' + e.message);
    });
  }
} catch(_) {}

onAuthStateChanged(auth, user => {
  if (user) {
    if (ALLOWED_EMAILS.includes(user.email)) {
      currentUser = user;
      try { localStorage.setItem('readings_authed', '1'); } catch(_) {}
      showRootScreen('app');
      subscribeBooks();
    } else {
      try { localStorage.removeItem('readings_authed'); } catch(_) {}
      $('denied-email').textContent = user.email;
      showRootScreen('denied-screen');
      if (unsubBooks) { unsubBooks(); unsubBooks = null; }
    }
  } else {
    currentUser = null;
    try { localStorage.removeItem('readings_authed'); } catch(_) {}
    showRootScreen('auth-screen');
    if (unsubBooks) { unsubBooks(); unsubBooks = null; }
    if (unsubMemos) { unsubMemos(); unsubMemos = null; }
  }
});

$('btn-google-login').onclick = async () => {
  const provider = new GoogleAuthProvider();
  try { await signInWithPopup(auth, provider); }
  catch(e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
      try { sessionStorage.setItem('auth_redirect_pending', '1'); } catch(_) {}
      await signInWithRedirect(auth, provider);
    } else {
      toast('로그인 실패: ' + e.message);
    }
  }
};
$('btn-denied-signout').onclick = () => signOut(auth);
$('btn-logout').onclick = () => signOut(auth);

// ── 안드로이드 뒤로가기 처리 ──
history.replaceState({page:'list'}, '');

window.addEventListener('popstate', () => {
  if($('add-modal').classList.contains('open')) {
    closeModal();
    return;
  }
  const detail = $('screen-detail');
  if(detail && detail.classList.contains('active')) {
    goList();
  }
});

$('btn-back').addEventListener('click', () => {
  if(history.state && history.state.page === 'detail') {
    history.back();
  } else {
    goList();
  }
});</script>
